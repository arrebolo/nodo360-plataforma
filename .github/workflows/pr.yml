name: Verificación de PR

# Solo en pull requests hacia main. No corre en push directo: produccion se
# despliega desde main via PR (regla 7), asi que ahi es donde tiene que mirar.
on:
  pull_request:
    branches: [main]

# Si se empuja otra vez a la misma PR, se cancela la tanda anterior.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # La version sale de .nvmrc, que es la unica fuente: la misma que
          # usan Vercel (nodeVersion 22.x) y engines.node de package.json.
          # Compilar aqui con otra no demostraria que el deploy va a funcionar,
          # y ademas el lockfile depende de la version de npm que trae Node.
          node-version-file: '.nvmrc'
          # Cachea ~/.npm usando package-lock.json como clave.
          cache: 'npm'

      # npm ci, no npm install: instala exactamente lo que dice el lockfile y
      # falla si package.json y el lock no cuadran. La PR #118 paso el build en
      # local y reventó en Vercel justo por eso (regla 6).
      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm run lint

      # lib/env.ts valida en arranque y lanza si falta una de las tres. Aqui
      # van de relleno, no reales: el build no consulta la base de datos —todas
      # las paginas que la tocan son force-dynamic— y solo necesita que no
      # esten vacias. Comprobado en local quitando .env.local.
      #
      # Tampoco tendria sentido meterlas como secretos: NEXT_PUBLIC_SUPABASE_URL
      # y NEXT_PUBLIC_SUPABASE_ANON_KEY son publicas por diseno, viajan en el
      # paquete que se sirve al navegador. Y las PRs desde un fork no reciben
      # secretos, asi que el paso fallaria siempre para quien venga de fuera.
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://nodo360.com
          NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: clave-de-relleno-para-ci

      # Falla solo con criticas o altas. Las moderadas se ven en el registro
      # pero no bloquean.
      #
      # El --omit=dev se puso por una alta en el sharp DE DESARROLLO que pedia
      # un cambio mayor. Ese motivo ya no existe: desde esta PR el sharp de
      # desarrollo esta en ^0.35.5 y el audit completo baja de 6 altas a 5.
      #
      # LA BANDERA SE QUEDA, y no por inercia: lo que esta puerta tiene que
      # vigilar es el arbol que se DESPLIEGA. Lo que queda en desarrollo es la
      # cadena braces -> micromatch -> fast-glob -> @next/eslint-plugin-next ->
      # eslint-config-next, que no viaja a produccion y cuya correccion depende
      # de que Next publique una version de su config de eslint.
      - run: npm audit --omit=dev --audit-level=high

      # Los umbrales de nivel viven en dos sitios a proposito. Esto comprueba
      # que no se separen, sin tocar la base de datos.
      - run: node scripts/check-level-thresholds.mjs

      # EL GUARDIAN DE LA COPIA PUBLICADA: ninguna superficie publica lee las
      # tablas de trabajo. Lo que ven los alumnos sale de *_publicados; si no,
      # cualquier cambio a medias del instructor se publica solo. Corta en el
      # primer hallazgo sin declarar, y tambien si sobra una excepcion, para que
      # la PR que mueva una lectura al espejo no pueda olvidarse de quitarla.
      #
      # No toca la base: solo lee el codigo, asi que no necesita credenciales.
      - run: npx tsx scripts/comprobar-lecturas-publicas.mts

      # Que ninguna pantalla de instructor o de mentor llame a /api/admin.
      #
      # Sigue el grafo de imports porque un grep no sirve: cuando se hizo, un grep
      # sobre las paginas del instructor daba cero y la regla estaba incumplida tres
      # niveles mas abajo, en un componente compartido con el panel.
      #
      # No toca la base: solo lee el codigo.
      - run: npx tsx scripts/comprobar-zonas-de-api.mts
