<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7931A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF9F43" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7931A"/>
      <stop offset="100%" stop-color="#FF9F43"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="#0a0a0a"/>
  <rect width="1200" height="675" fill="url(#bgGradient)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGradient)"/>
  <text x="600" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#F7931A">El subsidio por bloque, halving a halving</text>
  <text x="600" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="rgba(255,255,255,0.6)">Lo único que fija el protocolo. Las comisiones no cambian con el halving.</text>

  <line x1="150" y1="300" x2="1050" y2="300" stroke="#F7931A" stroke-width="4" stroke-linecap="round"/>

  <circle cx="150" cy="300" r="14" fill="#F7931A" stroke="white" stroke-width="3"/>
  <text x="150" y="262" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#F7931A">2012</text>
  <rect x="55" y="340" width="190" height="80" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="150" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="white">50 → 25 BTC</text>
  <text x="150" y="402" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.55)">bloque 210.000</text>

  <circle cx="450" cy="300" r="14" fill="#F7931A" stroke="white" stroke-width="3"/>
  <text x="450" y="262" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#F7931A">2016</text>
  <rect x="355" y="340" width="190" height="80" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="450" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="white">25 → 12,5 BTC</text>
  <text x="450" y="402" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.55)">bloque 420.000</text>

  <circle cx="750" cy="300" r="14" fill="#F7931A" stroke="white" stroke-width="3"/>
  <text x="750" y="262" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#F7931A">2020</text>
  <rect x="655" y="340" width="190" height="80" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="750" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="white">12,5 → 6,25 BTC</text>
  <text x="750" y="402" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.55)">bloque 630.000</text>

  <circle cx="1050" cy="300" r="14" fill="#F7931A" stroke="white" stroke-width="3"/>
  <text x="1050" y="262" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#F7931A">2024</text>
  <rect x="955" y="340" width="190" height="80" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="1050" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="white">6,25 → 3,125 BTC</text>
  <text x="1050" y="402" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.55)">bloque 840.000</text>

  <rect x="140" y="470" width="920" height="120" rx="12" fill="#F7931A" fill-opacity="0.12" stroke="#F7931A" stroke-width="2"/>
  <text x="600" y="516" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#F7931A">Lo que se reduce es el subsidio, no los ingresos del minero</text>
  <text x="600" y="556" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="rgba(255,255,255,0.75)">A medida que el subsidio baja, el peso de las comisiones en lo que cobra aumenta.</text>

  <text x="1170" y="655" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="rgba(255,255,255,0.3)">Nodo360</text>
</svg>
