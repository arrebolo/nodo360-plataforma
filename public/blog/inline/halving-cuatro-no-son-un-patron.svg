<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7931A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF9F43" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7931A"/>
      <stop offset="100%" stop-color="#FF9F43"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="#0a0a0a"/>
  <rect width="1200" height="675" fill="url(#bgGradient)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGradient)"/>
  <text x="600" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#F7931A">Cuatro halvings no son un patrón</text>
  <text x="600" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="rgba(255,255,255,0.6)">Han ocurrido cuatro veces, y cada una en un contexto distinto</text>

  <line x1="150" y1="290" x2="1050" y2="290" stroke="#F7931A" stroke-width="4" stroke-linecap="round"/>

  <circle cx="150" cy="290" r="14" fill="#F7931A" stroke="white" stroke-width="3"/>
  <text x="150" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#F7931A">2012</text>
  <text x="150" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.7)">mercado</text>
  <text x="150" y="362" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.7)">casi inexistente</text>

  <circle cx="450" cy="290" r="14" fill="#F7931A" stroke="white" stroke-width="3"/>
  <text x="450" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#F7931A">2016</text>

  <circle cx="750" cy="290" r="14" fill="#F7931A" stroke="white" stroke-width="3"/>
  <text x="750" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#F7931A">2020</text>

  <circle cx="1050" cy="290" r="14" fill="#F7931A" stroke="white" stroke-width="3"/>
  <text x="1050" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#F7931A">2024</text>
  <text x="1050" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.7)">productos financieros</text>
  <text x="1050" y="362" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.7)">regulados de por medio</text>

  <text x="600" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="rgba(255,255,255,0.5)">cada uno con otras condiciones alrededor</text>

  <rect x="140" y="430" width="920" height="160" rx="12" fill="#F7931A" fill-opacity="0.12" stroke="#F7931A" stroke-width="2"/>
  <text x="600" y="482" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#F7931A">Cuatro observaciones no son una serie</text>
  <text x="600" y="524" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="rgba(255,255,255,0.75)">Lo verificable es el protocolo: la recompensa se divide entre dos cada 210.000 bloques.</text>
  <text x="600" y="552" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="rgba(255,255,255,0.75)">Lo que el precio haga a partir de ahí no se deduce de eso.</text>

  <text x="1170" y="655" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="rgba(255,255,255,0.3)">Nodo360</text>
</svg>
