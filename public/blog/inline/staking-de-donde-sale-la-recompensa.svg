<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="#0a0a0a"/>
  <rect width="1200" height="675" fill="url(#bgGradient)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGradient)"/>
  <text x="600" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#7C3AED">De dónde sale la recompensa</text>
  <text x="600" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="rgba(255,255,255,0.6)">Solo hay dos sitios de los que puede salir</text>

  <rect x="120" y="150" width="430" height="200" rx="12" fill="rgba(255,255,255,0.05)" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#7C3AED">Emisión de unidades nuevas</text>
  <text x="335" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="rgba(255,255,255,0.75)">La red crea unidades que antes no</text>
  <text x="335" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="rgba(255,255,255,0.75)">existían y te paga con ellas.</text>
  <text x="335" y="312" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="rgba(255,255,255,0.55)">Hay más en circulación que antes</text>

  <text x="600" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="rgba(255,255,255,0.4)">o</text>

  <rect x="650" y="150" width="430" height="200" rx="12" fill="rgba(255,255,255,0.05)" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
  <text x="865" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#7C3AED">Comisiones de otros</text>
  <text x="865" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="rgba(255,255,255,0.75)">Lo que pagan quienes usan la red,</text>
  <text x="865" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="rgba(255,255,255,0.75)">repartido entre quienes validan.</text>
  <text x="865" y="312" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="rgba(255,255,255,0.55)">Sale del bolsillo de otro participante</text>

  <path d="M335 360 L335 400" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M865 360 L865 400" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M335 400 L865 400" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M600 400 L600 435" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="594,430 600,442 606,430" fill="#7C3AED"/>

  <rect x="120" y="450" width="960" height="140" rx="12" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-width="2"/>
  <text x="600" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#7C3AED">No hay una tercera fuente</text>
  <text x="600" y="540" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="rgba(255,255,255,0.75)">Si un servicio ofrece más de lo que la red reparte, la diferencia sale de algún sitio.</text>
  <text x="600" y="568" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="rgba(255,255,255,0.75)">La pregunta útil es de dónde, no cuánto.</text>

  <text x="1170" y="655" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="rgba(255,255,255,0.3)">Nodo360</text>
</svg>
